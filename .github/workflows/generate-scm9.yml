name: Generate pinned Scientific Colour Maps 9.0.0

on:
  push:
    branches: [upgrade-scientific-colour-maps-9]

permissions:
  contents: write

concurrency:
  group: scm9-generation
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-scientific-colour-maps-9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate from pinned upstream archive
        run: |
          npm run generate
          npm run generate -- --check
      - name: Validate package
        run: |
          npm test
          npm pack --dry-run
      - name: Commit validated generated data to migration branch
        run: |
          git add src/schemes.js src/palette-names.d.ts src/upstream-license.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate verified Scientific Colour Maps 9.0.0 tables'
          git push origin HEAD:refs/heads/upgrade-scientific-colour-maps-9
